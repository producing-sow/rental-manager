<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#20382f" />
    <title>租舍 · 收租管理</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=20261108-12" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/dashboard" aria-label="返回首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M9 22.5 24 10l15 12.5" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M13.5 20.5V38h21V20.5" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/>
              <path d="M20 38V27.5h8V38" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="brand-copy">
            <strong>租舍</strong>
            <small>收租管理</small>
          </span>
        </a>

        <nav class="main-nav" aria-label="主导航">
          <a href="#/dashboard" data-nav="dashboard">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            </svg>
            <span>首页概览</span>
          </a>
          <a href="#/properties" data-nav="properties">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 20V7.5L12 3l8 4.5V20M8 20v-5h8v5M8 9h.01M12 9h.01M16 9h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>房源房间</span>
          </a>
          <a href="#/receipts" data-nav="receipts">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 3.5h14v18l-2.5-1.8-2.2 1.8-2.3-1.8L9.7 21.5 7.5 19.7 5 21.5v-18Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M8.5 8h7M8.5 12h7M8.5 16h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <span>收据记录</span>
          </a>
          <a href="#/ledger" data-nav="ledger">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 20h16M6 20V9m4 11V5m4 15v-8m4 8V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>总台账</span>
          </a>
          <a href="#/settings" data-nav="settings">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.7"/>
              <path d="M19 14.2a7.7 7.7 0 0 0 .05-4.35l-2-.45a6.3 6.3 0 0 0-.85-1.45l.9-1.84a7.9 7.9 0 0 0-3.75-2.17L12.4 5.6a6.2 6.2 0 0 0-1.68.01l-.95-1.66A7.9 7.9 0 0 0 6 6.12l.9 1.84c-.35.45-.64.94-.85 1.47l-2 .45a7.7 7.7 0 0 0 .02 4.34l2 .46c.21.52.5 1.01.85 1.46l-.9 1.85a7.9 7.9 0 0 0 3.75 2.17l.95-1.66a6.2 6.2 0 0 0 1.68 0l.95 1.66a7.9 7.9 0 0 0 3.75-2.17l-.9-1.85c.35-.45.64-.94.85-1.47l2-.45Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
            <span>系统设置</span>
          </a>
          <a href="#/help" data-nav="help">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
              <path d="M9.7 9.2a2.5 2.5 0 0 1 4.85.9c0 1.7-2.55 1.95-2.55 3.7M12 17.3h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <span>使用帮助</span>
          </a>
        </nav>

        <div class="sidebar-note">
          <span class="sidebar-note-icon">本地</span>
          <div>
            <strong>数据保存在本机</strong>
            <p>不经过云端，收据和租客信息只存放在这台电脑。</p>
          </div>
        </div>
        <div class="sidebar-foot">
          <span id="todayLabel"></span>
          <span>v1.0</span>
        </div>
      </aside>

      <div class="mobile-scrim" id="mobileScrim"></div>

      <main class="main">
        <header class="topbar">
          <button class="icon-button menu-button" id="menuToggle" aria-label="打开导航">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <div class="page-heading">
            <div class="eyebrow" id="pageEyebrow">本月经营</div>
            <h1 id="pageTitle">首页概览</h1>
            <p id="pageSubtitle">把每月收租和抄表，做成一件顺手的小事。</p>
          </div>
          <div class="topbar-actions">
            <label class="month-pill" id="monthControl">
              <span>账期</span>
              <select id="monthSelect" aria-label="选择经营账期"></select>
            </label>
            <button class="btn btn-primary btn-compact" id="quickNew">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
              开一张收据
            </button>
          </div>
        </header>

        <section class="view" id="view" aria-live="polite">
          <div class="page-loading">
            <span class="loading-mark"></span>
            <p>正在整理账本…</p>
          </div>
        </section>
      </main>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script type="module" src="/app.js?v=20261108-12"></script>
  </body>
</html>
